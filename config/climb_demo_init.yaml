behaviors:
  Climb:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 16384
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    time_horizon: 128
    max_steps: 5000000
    summary_freq: 10000
    checkpoint_interval: 500000
    keep_checkpoints: 20
engine_settings:
  time_scale: 100
  no_graphics: true
torch_settings:
  device: cpu
environment_parameters:
  # Same as climb_target_incremental.yaml. Demo spawns are enabled by the --climb-snapshot-library player argument
  # (scripts/run_demo_init.py); spawn_demo_fraction states the code default explicitly (LAYER3_SNAPSHOT_DESIGN 8.1).
  target_mode: 0
  spawn_demo_fraction: 0.5
