behaviors:
  Climb:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 16384
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    time_horizon: 128
    max_steps: 8000000
    summary_freq: 10000
    checkpoint_interval: 500000
    keep_checkpoints: 20
engine_settings:
  time_scale: 100
  no_graphics: true
torch_settings:
  device: cpu
environment_parameters:
  # Strict control for the C0+C1 curriculum (docs/LAYER3_CURRICULUM_C0C1.md section 7): identical to climb_curriculum_c0c1.yaml (same player,
  # post-ResetBody-fix environment, 8M steps, height reward, spawn_demo_fraction, snapshot library) except that no curriculum file is
  # passed: every episode is the scene's training two-step. Note: spawn_demo_fraction 0.5 applies to every episode here, while in C0+C1
  # it applied only to the 25% two-step episodes (about 12.5% of all episodes).
  target_mode: 0
  spawn_demo_fraction: 0.5
  height_reward_scale: 0.2
  height_reward_cap: 0.2
