behaviors:
  Climb:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 16384
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    time_horizon: 128
    max_steps: 5000000
    summary_freq: 10000
    checkpoint_interval: 500000
    keep_checkpoints: 20
engine_settings:
  time_scale: 100
  no_graphics: true
torch_settings:
  device: cpu
environment_parameters:
  # 0 = incremental (pilot default), 1 = absolute. The only difference between the two target-representation configs.
  target_mode: 0
