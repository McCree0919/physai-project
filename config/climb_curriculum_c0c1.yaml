behaviors:
  Climb:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 16384
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    time_horizon: 128
    max_steps: 8000000
    summary_freq: 10000
    checkpoint_interval: 500000
    keep_checkpoints: 20
engine_settings:
  time_scale: 100
  no_graphics: true
torch_settings:
  device: cpu
environment_parameters:
  # Identical to climb_height_shaping.yaml except the structure distribution (LAYER3_DESIGN §17): per episode the training two-step
  # with probability 0.25 (pools.json twoStepShare), otherwise a structure from the stage pool of --climb-curriculum. Demonstration
  # spawns (50%) only on the two-step. Fixed schedule: C0 for 3M steps (progress 3M/8M = 0.375), then C1 for the remaining 5M.
  target_mode: 0
  spawn_demo_fraction: 0.5
  height_reward_scale: 0.2
  height_reward_cap: 0.2
  curriculum_stage:
    curriculum:
      - name: C0
        completion_criteria:
          behavior: Climb
          measure: progress
          threshold: 0.375
        value: 0
      - name: C1
        value: 1
