behaviors:
  Climb:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 16384
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    time_horizon: 128
    max_steps: 5000000
    summary_freq: 10000
    checkpoint_interval: 500000
    keep_checkpoints: 20
engine_settings:
  time_scale: 100
  no_graphics: true
torch_settings:
  device: cpu
environment_parameters:
  # Same as climb_demo_init.yaml (incremental, 50% demo spawns via --climb-snapshot-library) plus the height-shaping term
  # (LAYER3_HEIGHT_SHAPING.md): 0.2 per metre of new episode-best torso height, total <= 0.2 (< progress cap 0.3).
  target_mode: 0
  spawn_demo_fraction: 0.5
  height_reward_scale: 0.2
  height_reward_cap: 0.2
