behaviors:
  Climb:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 16384
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    time_horizon: 128
    max_steps: 8000000
    summary_freq: 10000
    checkpoint_interval: 500000
    keep_checkpoints: 20
engine_settings:
  time_scale: 100
  no_graphics: true
torch_settings:
  device: cpu
environment_parameters:
  # LAYER3_C2_DESIGN section 1-3: identical to climb_curriculum_c0c1.yaml except the structure distribution and the initialization.
  # Initialized from the C0+C1 8M checkpoint of the same seed (--initialize-from, set by scripts/run_curriculum_c2.py; steps restart
  # at 0, so max_steps 8M are 8M further steps). One stage, structures/curriculum-v2/pools.json: per episode the training two-step
  # with probability 0.25, otherwise sub-pool A 0.15, B 0.20, C 0.20, D 0.20 of all episodes. Demonstration spawns (50%) only on
  # the two-step, as in C1.
  target_mode: 0
  spawn_demo_fraction: 0.5
  height_reward_scale: 0.2
  height_reward_cap: 0.2
  curriculum_stage: 0
